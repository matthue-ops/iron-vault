<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Access Portal</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Supabase JS SDK -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            500: 'var(--brand-primary)',
                            600: 'var(--brand-primary)',
                            700: 'var(--brand-primary)',
                            900: '#064e3b',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }

    <style>
        :root {
            --brand-primary: #10b981;
            --brand-primary-glow: rgba(16, 185, 129, 0.2);
            --bg-base: #090d16;
            --card-bg: rgba(17, 24, 39, 0.75);
        }

        body {
            background-color: var(--bg-base);
            font-family: 'Inter', sans-serif;
        }

        .glass-card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }

        .glass-input {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-input:focus {
            border-color: var(--brand-primary);
            box-shadow: 0 0 0 2px var(--brand-primary-glow);
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.35; transform: scale(1); }
            50% { opacity: 0.65; transform: scale(1.05); }
        }

        .bg-glow-orb {
            animation: pulseGlow 8s infinite ease-in-out;
        }
    </style>
    <script src="../assets/auth-session.js"></script>

                    <div>

                        <div class="relative">

                            </span>

                    <div>
                        <label class="block text-xs font-medium text-slate-300 mb-1.5">Password</label>

                                <i id="pwd-icon-2" class="fa-solid fa-eye text-xs"></i>

                    <button type="submit" id="btn-submit-signup" class="w-full py-3.5 rounded-xl font-bold text-xs uppercase tracking-wider text-slate-950 bg-emerald-500 hover:opacity-90 transition shadow-lg flex items-center justify-center gap-2 mt-2">

    </main>

        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const MEMBERS_STORAGE_KEY = 'ironvault_members_db';

        const SESSION_KEY = 'ironvault_active_member';
        const ACTIVE_TENANT_KEY = 'ironvault_active_tenant_id';
        const ACTIVE_ROLE_KEY = 'ironvault_active_role';

        function applyDynamicThemeFromLogo(logoBase64) {
            if (!logoBase64) return;

            const img = new Image();
            if (!logoBase64.startsWith('data:')) {
                img.crossOrigin = "Anonymous";
            }
            img.src = logoBase64;

            img.onload = function () {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                const width = 50;
                const height = 50;
                canvas.width = width;
                canvas.height = height;
                
                try {
                    ctx.drawImage(img, 0, 0, width, height);
                    const imageData = ctx.getImageData(0, 0, width, height).data;
                    
                    let rSum = 0, gSum = 0, bSum = 0, count = 0;

                    for (let i = 0; i < imageData.length; i += 16) {
                        const r = imageData[i];
                        const g = imageData[i + 1];
                        const b = imageData[i + 2];
                        const alpha = imageData[i + 3];

                        if (alpha > 125 && !(r > 230 && g > 230 && b > 230) && !(r < 25 && g < 25 && b < 25)) {
                            rSum += r;
                            gSum += g;
                            bSum += b;
                            count++;
                        }
                    }

                    if (count > 10) {
                        const avgR = Math.round(rSum / count);
                        const avgG = Math.round(gSum / count);
                        const avgB = Math.round(bSum / count);
                        const hexColor = `#${((1 << 24) + (avgR << 16) + (avgG << 8) + avgB).toString(16).slice(1)}`;

                        document.documentElement.style.setProperty('--brand-primary', hexColor);
                        document.documentElement.style.setProperty('--brand-primary-glow', `${hexColor}33`);

                        const headerLogoWrap = document.getElementById('header-logo-container');
                        if (headerLogoWrap) {
                            headerLogoWrap.style.borderColor = hexColor;
                            headerLogoWrap.style.boxShadow = `0 0 12px ${hexColor}40`;
                        }
                    }
                } catch (e) {
                    console.error("Canvas pixel extraction restricted:", e);
                }
            };
        }

        const app = {
            currentTenantId: null,
            matchedOwnerRecord: null,
            currentTab: 'SIGNIN',

            init: async function() {
                await this.detectTenantFromUrl();
            },

            detectTenantFromUrl: async function() {
                const urlParams = new URLSearchParams(window.location.search);
                const keyParam = urlParams.get('key');
                const gymParam = urlParams.get('gym');

                let loadedOwners = [];
                try {
                    const query=supabaseClient.from('owners').select('id,gym_name,token,logo,status,pricing');
                    const {data,error}=(keyParam||gymParam)
                        ? await (keyParam?query.eq('token',keyParam):query.eq('id',gymParam.toUpperCase()))
                        : {data:[],error:null};
                    if (!error && data) {
                        loadedOwners = data.map(o => ({
                            id: o.id,
                            gymName: o.gym_name,
                            token: o.token,
                            logo: o.logo,
                            status: o.status,
                            pricing: o.pricing,
                        }));
                    }
                } catch(e) {}

                let matched = null;
                if (keyParam) {
                    matched = loadedOwners.find(o => o.token === keyParam);
                } else if (gymParam) {
                    matched = loadedOwners.find(o => o.id === gymParam.toUpperCase());
                }

                if (matched) {
                    this.currentTenantId = matched.id;
                    this.matchedOwnerRecord = matched;
                    
                    document.getElementById('header-gym-name').innerText = matched.gymName;
                    document.getElementById('header-branch-badge').innerText = `Access & Management Portal`;
                    document.getElementById('page-title').innerText = `${matched.gymName} - Access Portal`;
                    document.getElementById('portal-subtitle').innerText = `Sign in to your account at ${matched.gymName}`;

                    if (matched.logo) {
                        const headerImg = document.getElementById('header-logo-img');
                        const headerIcon = document.getElementById('header-logo-icon');
                        headerImg.src = matched.logo;
                        headerImg.classList.remove('hidden');
                        headerIcon.classList.add('hidden');

                        applyDynamicThemeFromLogo(matched.logo);
                    }
                    return;
                }

                // NO VALID TENANT FOUND STATE
                this.currentTenantId = null;
                this.matchedOwnerRecord = null;

                document.getElementById('header-gym-name').innerText = "INVALID LINK";
                document.getElementById('header-branch-badge').innerText = "Invalid or Missing Link";
                document.getElementById('page-title').innerText = "Portal - Invalid Link";
                document.getElementById('portal-subtitle').innerText = "A valid gym portal URL is required to sign in or sign up.";

                this.showAlert("A valid gym portal URL is required to sign in or sign up.");
                
                // Disable form inputs & buttons
                document.getElementById('signin-identifier').disabled = true;
                document.getElementById('signin-password').disabled = true;
                document.getElementById('btn-submit-signin').disabled = true;
                document.getElementById('btn-submit-signin').classList.add('opacity-50', 'cursor-not-allowed');

                document.getElementById('admin-login-email').disabled = true;
                document.getElementById('admin-login-password').disabled = true;
                document.getElementById('btn-submit-admin').disabled = true;
                document.getElementById('btn-submit-admin').classList.add('opacity-50', 'cursor-not-allowed');

                document.getElementById('signup-name').disabled = true;
                document.getElementById('signup-email').disabled = true;
                document.getElementById('signup-phone').disabled = true;
                document.getElementById('signup-password').disabled = true;
                document.getElementById('btn-submit-signup').disabled = true;
                document.getElementById('btn-submit-signup').classList.add('opacity-50', 'cursor-not-allowed');
            },

            switchTab: function(tab) {
                this.currentTab = tab;
                const btnSignIn = document.getElementById('tab-btn-signin');
                const btnAdmin = document.getElementById('tab-btn-admin');
                const btnSignUp = document.getElementById('tab-btn-signup');

                const formSignIn = document.getElementById('auth-signin-form');
                const formAdmin = document.getElementById('auth-admin-form');
                const formSignUp = document.getElementById('auth-signup-form');

                if (!this.currentTenantId) return;

                document.getElementById('form-alert').classList.add('hidden');

                btnSignIn.className = "flex-1 py-2.5 rounded-xl transition text-slate-400 hover:text-white flex items-center justify-center gap-1.5";
                btnAdmin.className = "flex-1 py-2.5 rounded-xl transition text-slate-400 hover:text-white flex items-center justify-center gap-1.5";
                btnSignUp.className = "flex-1 py-2.5 rounded-xl transition text-slate-400 hover:text-white flex items-center justify-center gap-1.5";

                formSignIn.classList.add('hidden');
                formAdmin.classList.add('hidden');
                formSignUp.classList.add('hidden');

                if (tab === 'SIGNIN') {
                    btnSignIn.className = "flex-1 py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 bg-[var(--brand-primary)] text-slate-950 font-bold shadow-md";
                    formSignIn.classList.remove('hidden');
                } else if (tab === 'ADMIN') {
                    btnAdmin.className = "flex-1 py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 bg-amber-500 text-slate-950 font-bold shadow-md";
                    formAdmin.classList.remove('hidden');
                } else {
                    btnSignUp.className = "flex-1 py-2.5 rounded-xl transition flex items-center justify-center gap-1.5 bg-[var(--brand-primary)] text-slate-950 font-bold shadow-md";
                    formSignUp.classList.remove('hidden');
                }
            },

            togglePasswordVisibility: function(inputId, iconId) {
                const pwdInput = document.getElementById(inputId);
                const icon = document.getElementById(iconId);
                if (pwdInput.type === 'password') {
                    pwdInput.type = 'text';
                    icon.className = "fa-solid fa-eye-slash text-xs";
                } else {
                    pwdInput.type = 'password';
                    icon.className = "fa-solid fa-eye text-xs";
                }
            },

            showAlert: function(msg, isSuccess = false) {
                const alertBox = document.getElementById('form-alert');
                const alertMsg = document.getElementById('form-alert-msg');
                const alertIcon = document.getElementById('form-alert-icon');

                alertMsg.innerText = msg;
                alertBox.classList.remove('hidden', 'bg-rose-500/10', 'border-rose-500/30', 'text-rose-300', 'bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300');

                if (isSuccess) {
                    alertBox.classList.add('bg-emerald-500/10', 'border-emerald-500/30', 'text-emerald-300');
                    alertIcon.className = "fa-solid fa-circle-check text-base flex-shrink-0";
                } else {
                    alertBox.classList.add('bg-rose-500/10', 'border-rose-500/30', 'text-rose-300');
                    alertIcon.className = "fa-solid fa-circle-exclamation text-base flex-shrink-0";
                }
            },


        };

        window.onload = async function() {
            await app.init();
        };
    </script>
<script>

const ivDate = (d=new Date()) => new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Manila',year:'numeric',month:'2-digit',day:'2-digit'}).format(d);
const ivMoney = n => '₱'+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});

async function ivRequireRole(roles, tenant){
 return IronVaultAuth.requireRole(supabaseClient,{
  roles, tenantId:tenant, allowGlobalSuperAdmin:roles.includes('super_admin')
 });
}

app.handleSignInSubmit=async function(e){e.preventDefault();
 const email=document.getElementById('signin-identifier').value.trim();
 if(!email.includes('@')){this.showAlert('Please sign in with your registered email address. Member ID login requires account migration.');return;}
 const {error}=await supabaseClient.auth.signInWithPassword({email,password:document.getElementById('signin-password').value});
 if(error){this.showAlert(error.message);return;}
 try{const role=await ivRequireRole(['member'],this.currentTenantId);
 if(!role.member_id)throw Error('Your Auth account is not linked to a member record.');
 sessionStorage.setItem(SESSION_KEY,role.member_id);window.location.href='memberprofile.html';}
 catch(err){await supabaseClient.auth.signOut();this.showAlert(err.message);}
};
app.handleAdminLoginSubmit=async function(e){e.preventDefault();
 const email=document.getElementById('admin-login-email').value.trim();
 const {error}=await supabaseClient.auth.signInWithPassword({email,password:document.getElementById('admin-login-password').value});
 if(error){this.showAlert(error.message);return;}
 try{const role=await ivRequireRole(['owner','staff'],this.currentTenantId);
 sessionStorage.setItem(ACTIVE_TENANT_KEY,role.tenant_id);
 sessionStorage.setItem(ACTIVE_ROLE_KEY,role.role==='owner'?'admin':'staff');
 sessionStorage.setItem(LOGGED_USER_KEY,email);
 await supabaseClient.rpc('iv_staff_event',{p_tenant:role.tenant_id,p_event:'login'});
 window.location.href='admin.html?key='+encodeURIComponent(this.matchedOwnerRecord?.token||'');}
 catch(err){await supabaseClient.auth.signOut();this.showAlert(err.message);}
};

</script>

<script>
// Iron Vault member Auth: self-registration creates an Auth user; SQL trigger links member/role.
app.handleSignUpSubmit = async function(event) {
  event.preventDefault();
  if (!this.currentTenantId || !this.matchedOwnerRecord?.token) return this.showAlert('Invalid gym link.');
  const name = document.getElementById('signup-name').value.trim();
  const email = document.getElementById('signup-email').value.trim().toLowerCase();
  const phone = document.getElementById('signup-phone').value.trim();
  const password = document.getElementById('signup-password').value;
  if (password.length < 8) return this.showAlert('Use a password of at least 8 characters.');
  const button = document.getElementById('btn-submit-signup'); button.disabled = true;
  try {
    const {data,error} = await supabaseClient.auth.signUp({
      email,password,
      options:{data:{iv_member_signup:true,iv_tenant_token:this.matchedOwnerRecord.token,iv_member_name:name,iv_member_phone:phone},
      emailRedirectTo:new URL('memberlogin.html'+window.location.search,location.href).href}
    });
    if (error) throw error;
    if (!data?.user) throw Error('Account could not be created.');
    document.getElementById('auth-signup-form').reset();
    this.switchTab('SIGNIN');
    this.showAlert('Registration submitted. Check your email to confirm your account, then wait for gym approval.',true);
  } catch(err) {this.showAlert(err.message || 'Registration failed.');}
  finally {button.disabled = false;}
};
app.handleForgotPassword = async function(event) {
  event.preventDefault();
  const email = document.getElementById('signin-identifier').value.trim();
  if (!email.includes('@')) return this.showAlert('Enter your registered email address first.');
  const {error} = await supabaseClient.auth.resetPasswordForEmail(email,{
    redirectTo:new URL('memberlogin.html'+window.location.search,location.href).href
  });
  this.showAlert(error ? error.message : 'If this email is registered, a recovery email will arrive shortly.',!error);
};
async function ivResendEmailConfirmation() {
  const email = document.getElementById('signin-identifier').value.trim();
  if (!email.includes('@')) return app.showAlert('Enter your registered email address first.');
  const {error} = await supabaseClient.auth.resend({type:'signup',email});
  app.showAlert(error ? error.message : 'If this email is awaiting confirmation, a new verification email will arrive shortly.',!error);
}
// Only a Supabase PASSWORD_RECOVERY event authorizes changing the password here.
let ivRecoveryAuthorized = false;
supabaseClient.auth.onAuthStateChange((event) => {
  if (event !== 'PASSWORD_RECOVERY') return;
  ivRecoveryAuthorized = true;
  document.getElementById('iv-recovery-panel').classList.remove('hidden');
});
async function ivCompleteRecovery(event) {
  event.preventDefault();
  const feedback = document.getElementById('iv-recovery-feedback');
  const password = document.getElementById('iv-recovery-password').value;
  if (!ivRecoveryAuthorized) { feedback.textContent = 'Open a valid recovery link first.'; return; }
  if (password.length < 8 || password !== document.getElementById('iv-recovery-confirm').value) {
    feedback.textContent = 'Passwords must match and contain at least 8 characters.'; return;
  }
  const {error} = await supabaseClient.auth.updateUser({password});
  if (error) { feedback.textContent = error.message; return; }
  ivRecoveryAuthorized = false;
  document.getElementById('iv-recovery-panel').classList.add('hidden');
  document.getElementById('iv-recovery-password').value = '';
  document.getElementById('iv-recovery-confirm').value = '';
  await supabaseClient.auth.signOut();
  app.showAlert('Password changed. Please sign in with your new password.',true);
}
</script>
